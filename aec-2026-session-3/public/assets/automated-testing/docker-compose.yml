services:
  # --------------------------------------------------------------------------
  # Leaderboard / test framework
  # --------------------------------------------------------------------------

  framework:
    build: .
    restart: always
    ports:
      - "80:3000"
    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_URL: "redis://redis:6379"
      # Add one entry per competitor. ipAddress is matched against the source
      # IP of incoming test submissions; databaseServer is the Docker service
      # name of that competitor's SQL Server container.
      COMPETITORS: |
        [
          { "seat": 1, "name": "Alice", "ipAddress": "192.168.1.101" },
          { "seat": 2, "name": "Bob",   "ipAddress": "192.168.1.102" }
        ]

  # --------------------------------------------------------------------------
  # Redis — leaderboard persistence
  # --------------------------------------------------------------------------

  redis:
    image: redis:8.4-alpine
    restart: always
    volumes:
      - redis_data:/data
