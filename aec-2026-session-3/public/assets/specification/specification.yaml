  "/api/cart/{id}/checkout/start":
    post:
      summary: "Start checkout process"
      operationId: startCheckoutProcess
      description: "Initiates the checkout process for a cart and returns a payment URL. Returns the same payment session for a cart as long as it is pending. Creates a new one if the existing session failed."
      parameters: []
      responses:
        200:
          description: "Checkout initiated"
          content:
            application/json:
              schema:
                type: object
                example:
                  cart_id: 5c4a4909-ce2a-456c-a8e7-4b07d30596e6
                  payment_url: "https://payment-portal.com/payment/1"
                properties:
                  cart_id:
                    type: string
                    example: 5c4a4909-ce2a-456c-a8e7-4b07d30596e6
                  payment_url:
                    type: string
                    example: "https://payment-portal.com/payment/1"
        404:
          description: "Cart not found"
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Cart not found"
                properties:
                  message:
                    type: string
                    example: "Cart not found"
        409:
          description: "Cart is expired"
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Cart is expired"
                properties:
                  message:
                    type: string
                    example: "Cart is expired"
        422:
          description: "Validation error"
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Validation error"
                  errors:
                    callbackUrl:
                      - "The callback url field is required"
                properties:
                  message:
                    type: string
                    example: "Validation error"
                  errors:
                    type: object
                    properties:
                      callbackUrl:
                        type: array
                        example:
                          - "The callback url field is required"
                        items:
                          type: string
      tags:
        - Cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackUrl:
                  type: string
                  description: "URL to redirect to after payment completion"
                  example: "https://my-site.com/payment-completed"
              required:
                - callbackUrl
      security: []
    parameters:
      - in: path
        name: id
        description: "The ID of the cart"
        example: e4b06896-9fb3-467c-90e6-22f537871f2b
        required: true
        schema:
          type: string
  "/api/cart/{id}/checkout/complete":
    post:
      summary: "Complete checkout process"
      operationId: completeCheckoutProcess
      description: "Completes the checkout process after payment has been processed.\nThis endpoint should be called after the payment provider redirects back to your callback URL."
      parameters: []
      responses:
        200:
          description: "Checkout completed successfully"
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  \"paid_at\": \"2024-01-15T11:30:00+00:00\",\n  \"cart_id\": \"5c4a4909-ce2a-456c-a8e7-4b07d30596e6\",\n}"
        404:
          description: "Cart not found"
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Cart not found"
                properties:
                  message:
                    type: string
                    example: "Cart not found"
        409:
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - description: "Payment failed"
                    type: object
                    example:
                      message: "Payment failed"
                      error: INSUFFICIENT_FUNDS
                    properties:
                      message:
                        type: string
                        example: "Payment failed"
                      error:
                        type: string
                        example: INSUFFICIENT_FUNDS
                  - description: "Cart is expired"
                    type: object
                    example:
                      message: "Cart is expired"
                      error: EXPIRED
                    properties:
                      message:
                        type: string
                        example: "Cart is expired"
                      error:
                        type: string
                        example: EXPIRED
                  - description: "Checkout not started"
                    type: object
                    example:
                      message: "Checkout has not been started"
                      error: NO_SESSION
                    properties:
                      message:
                        type: string
                        example: "Checkout has not been started"
                      error:
                        type: string
                        example: NO_SESSION
                  - description: "Payment not completed"
                    type: object
                    example:
                      message: "Payment has not been completed"
                      error: PENDING
                    properties:
                      message:
                        type: string
                        example: "Payment has not been completed"
                      error:
                        type: string
                        example: PENDING
      tags:
        - Cart
      security: []
    parameters:
      - in: path
        name: id
        description: "The ID of the cart"
        example: e4b06896-9fb3-467c-90e6-22f537871f2b
        required: true
        schema:
          type: string
