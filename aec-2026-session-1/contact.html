<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact us">
    <title>Contact us - Neubrandenbook</title>
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip the navigation links</a>
    <header class="main-header">
        <div class="container-inner">
            <a href="index.html">
                <img src="assets/logo/logo_black.png" alt="Logo" class="logo light-only">
                <img src="assets/logo/logo_white.png" alt="Logo" class="logo dark-only">
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="catalogue.html">Catalogue</a>
                <a href="about.html">About</a>
                <a class="active" href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="main-content" id="main">
        <div class="section container-inner">
            <div class="contact-layout">
                <section class="contact-panel">
                    <h1>Contact us</h1>
                    <ul class="contact-list">
                        <li>Adress: Demminer Str. 42, 17034 Neubrandenburg</li>
                        <li>Email: <a href="mailto:contact@neubrandenbook.de">contact@neubrandenbook.de</a></li>
                        <li>Phone: <a href="tel:+4915888646604">+49 15888 646604</a></li>
                    </ul>
                </section>

                <form class="contact-form">
                    <label class="contact-field">
                        <span>Name</span>
                        <input type="text" name="name" autocomplete="name" required>
                    </label>

                    <label class="contact-field">
                        <span>Email</span>
                        <input type="email" name="email" autocomplete="email" required>
                    </label>

                    <label class="contact-field">
                        <span>Message</span>
                        <textarea name="message" rows="8" required></textarea>
                    </label>

                    <button class="button" type="submit">Contact us</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container-inner">&copy; 2026 Neubrandenbook</div>
    </footer>
</body>
</html>
