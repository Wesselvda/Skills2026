<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heart</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #fdf2f4;
      }

      .heart {
        position: relative;
        width: 200px;
        height: 200px;
        background-color: #e0245e;
        transform: rotate(45deg);
      }

      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 200px;
        height: 200px;
        background-color: #e0245e;
        border-radius: 50%;
      }

      .heart::before {
        top: -100px;
        left: 0;
      }

      .heart::after {
        top: 0;
        left: -100px;
      }
    </style>
  </head>
  <body>
    <div class="heart"></div>
  </body>
</html>
